{% extends "base/base.html" %}
{% block titulo %}Eliminar punto de entrega{% endblock %}

{% block contenido %}
<section class="mc-panel">
  <h2>Eliminar punto de entrega</h2>
  <div class="mc-slot"><p>¿Eliminar «{{ object }}»? Esta acción no se puede deshacer.</p></div>
  <form method="post">
    {% csrf_token %}
    <div class="mc-acciones">
      <button type="submit" class="mc-btn rojo">Eliminar</button>
      <a class="mc-btn" href="{% url 'punto_de_entrega:list' %}">Cancelar</a>
    </div>
  </form>
</section>
{% endblock %}
