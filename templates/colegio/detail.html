{% extends "base/base.html" %}
{% block titulo %}Colegio{% endblock %}

{% block contenido %}
<section class="mc-panel">
  <h2>Colegio</h2>
  <dl class="mc-detalle mc-slot">
    <dt>Colegio</dt>
    <dd>{{ object }}</dd>
  </dl>
  <div class="mc-acciones">
    {% if perms.colegio.change_colegio %}<a class="mc-btn" href="{% url 'colegio:update' object.pk %}">Editar</a>{% endif %}
    {% if perms.colegio.delete_colegio %}<a class="mc-btn rojo" href="{% url 'colegio:delete' object.pk %}">Eliminar</a>{% endif %}
    <a class="mc-btn" href="{% url 'colegio:list' %}">Volver</a>
  </div>
</section>
{% endblock %}
